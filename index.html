<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #0f172a; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: manipulation; }
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100%; height: 100%; max-width: 480px; max-height: 800px; display: block; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; }
    .btn { pointer-events: auto; background: #22c55e; color: #fff; border: none; padding: 16px 36px; font-size: 1.3rem; font-weight: bold; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 20px rgba(34, 197, 94, 0.5); transition: transform 0.1s; }
    .btn:active { transform: scale(0.95); }
    .score-board { position: absolute; top: 30px; font-size: 2.2rem; font-weight: bold; text-shadow: 0 3px 6px rgba(0,0,0,0.7); z-index: 10; }
    #menu-overlay { background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(6px); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; pointer-events: auto; text-align: center; padding: 20px; }
    h1 { font-size: 3rem; color: #4ade80; text-shadow: 0 3px 10px rgba(74, 222, 128, 0.4); }
    p { color: #cbd5e1; font-size: 1rem; line-height: 1.5; }
    .high-score { font-size: 1.1rem; color: #fbbf24; font-weight: bold; }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="score-board" id="score">0</div>
    <canvas id="canvas"></canvas>
    
    <div class="ui-layer" id="ui">
      <div id="menu-overlay">
        <h1>Flappy Snake</h1>
        <p>Tippe zum Hüpfen.<br>Weiche den Rohren aus, friss Obst und lass die Schlange vertikal wachsen!</p>
        <div class="high-score" id="high-score-text">Highscore: 0</div>
        <button class="btn" id="start-btn">SPIELEN</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const uiEl = document.getElementById('ui');
    const menuOverlay = document.getElementById('menu-overlay');
    const startBtn = document.getElementById('start-btn');
    const highScoreText = document.getElementById('high-score-text');

    let width, height;
    function resize() {
      width = canvas.width = canvas.clientWidth;
      height = canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Hintergrundbild (Himmel)
    const skyBg = new Image();
    skyBg.crossOrigin = "anonymous";
    skyBg.src = "https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?auto=format&fit=crop&w=800&q=80";

    // Sound-Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'flap') {
        osc.frequency.setValueAtTime(250, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'eat') {
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // Spielvariablen
    let isRunning = false;
    let score
      on draw() {
      ctx.clearRect(0, 0, width, height);

      // Hintergrundbild zeichnen[span_1](start_span)[span_1](end_span)
      if (skyBg.complete) {
        ctx.drawImage(skyBg, 0, 0, width, height);
      } else {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(0, 0, width, height);
      }

      // Obst (kleines rotes Früchtchen)
      if (fruit && !fruit.collected) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(fruit.x, fruit.y, fruit.radius, 0, Math.PI * 2);
        ctx.fill();
        // Stängel
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(fruit.x, fruit.y - fruit.radius);
        ctx.lineTo(fruit.x + 4, fruit.y - fruit.radius - 5);
        ctx.stroke();
      }

      // Rohre zeichnen
      ctx.fillStyle = '#16a34a';
      ctx.strokeStyle = '#15803d';
      ctx.lineWidth = 3;
      pipes.forEach(p => {
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.strokeRect(p.x, 0, pipeWidth, p.top);
        ctx.fillRect(p.x, height - p.bottom, pipeWidth, p.bottom);
        ctx.strokeRect(p.x, height - p.bottom, pipeWidth, p.bottom);
      });

      // Schlangen-Körper (läuft nach hinten dünner zu)
      for (let i = snake.body.length - 1; i >= 0; i--) {
        let seg = snake.body[i];
        let progress = i / snake.body.length;
        let radius = Math.max(4, snake.baseRadius * (1 - progress * 0.55));
        
        ctx.fillStyle = i === 0 ? '#4ade80' : `rgb(34, ${197 - Math.floor(progress * 50)}, 94)`;
        ctx.beginPath();
        ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Schlangenkopf mit Gesicht & Augen
      let head = snake.body[0] || { x: snake.x, y: snake.y };
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(head.x, head.y, snake.baseRadius + 1, 0, Math.PI * 2);
      ctx.fill();

      // Augen (Weiß + Pupille)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(head.x + 4, head.y - 4, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(head.x + 6, head.y - 4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Zügige Zunge
      if (Math.floor(frame / 15) % 2 === 0) {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(head.x + snake.baseRadius, head.y + 2);
        ctx.lineTo(head.x + snake.baseRadius + 8, head.y + 2);
        ctx.stroke();
      }
    }

    function loop() {
      update();
      draw();
      if (isRunning) requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
